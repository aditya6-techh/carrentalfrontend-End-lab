name: Build and Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          # You can specify a different node version if your project needs it

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      # Optional deployment step - customize as needed
      # For example, deploying to GitHub Pages:
      # Uncomment the following and adjust if using GitHub Pages
      # - name: Deploy to GitHub Pages
      #   uses: peaceiris/actions-gh-pages@v4
      #   with:
      #     github_token: ${{ secrets.GITHUB_TOKEN }}
      #     publish_dir: ./build
